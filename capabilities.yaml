# Source of truth for agent skills, MCP servers, rules, and hooks.
# Edit this file, then run: capa install
# Docs: https://capa.sh/ — providers are generated by capa install.

providers:
  - cursor
  - claude-code

options:
  toolExposure: search
  requiresCommands:
    - cli: gh
      description: GitHub CLI (issues, PRs, releases). Install from https://cli.github.com/

skills:
  - id: capabilities-manager
    type: github
    def:
      repo: infragate/capa@capabilities-manager
      description: Guide for managing capabilities with capa CLI
  - id: bootstrap
    type: github
    def:
      repo: infragate/capa@bootstrap
      description: >-
        Capify an existing project: discover skills/rules/hooks/MCP servers
        across all providers and synthesize capabilities.yaml

servers: []

tools: []

plugins:
  - id: office-kit
    type: github
    def:
      repo: Minitour/office-kit::plugins/office-kit
      description: Create branded standalone HTML documents, Slidev decks, and
        HyperFrames videos in an isolated OfficeKit workspace.

rules: []

hooks: []
